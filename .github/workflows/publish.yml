name: Publish to npm and GitHub Packages

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. Pinned to the 11
      # major rather than @latest: npm 12 requires node 22.22+/24.15+, so
      # @latest silently outgrew the node version pinned above and broke the
      # v1.4.1 publish.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm publish --provenance --access public

  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@joaodotwork'
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
